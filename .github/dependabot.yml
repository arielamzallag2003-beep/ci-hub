version: 2
updates:
  # Actions are pinned to commit SHAs, which means Dependabot is the thing that
  # tells us a pin has fallen behind. It opens a pull request; it never pushes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
