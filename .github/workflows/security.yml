name: Security

# Deeper, slower checks that do not belong on every push. Projects call this on
# a weekly schedule. Read-only: it uploads findings to the Security tab and
# changes nothing in the repository.

on:
  workflow_call:
    inputs:
      run-scorecard:
        description: >-
          Run OpenSSF Scorecard. It only works on public repositories, so it is
          skipped automatically on private ones rather than failing.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  full-history-secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arielamzallag2003-beep/ci-hub
          ref: ${{ github.job_workflow_sha }}
          path: .ci-hub
          persist-credentials: false
      - name: gitleaks (full history)
        run: bash .ci-hub/.github/scripts/gitleaks.sh git

  scorecard:
    name: OpenSSF Scorecard
    if: inputs.run-scorecard && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: scorecard.sarif
