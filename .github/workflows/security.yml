name: Security

# Deeper, slower checks that do not belong on every push. Projects call this on
# a weekly schedule. Read-only: it uploads findings to the Security tab and
# changes nothing in the repository.

on:
  workflow_call:
    inputs:
      run-scorecard:
        description: >-
          Run OpenSSF Scorecard. It only works on public repositories, so it is
          skipped automatically on private ones rather than failing.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  full-history-secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  scorecard:
    name: OpenSSF Scorecard
    if: inputs.run-scorecard && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif
